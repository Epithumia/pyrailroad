[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrailroad"
authors = [
    {name = "Rafael Lopez", email = "rafael.lopez@universite-paris-saclay.fr"},
]
description = "Python package to draw railroad (or syntax) diagrams. Based largely on railroad-diagram and the partial parser by tabatkins."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["railroad", "diagram"]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer<=0.27.3", "pyyaml<=6.0.3", "DHParser<1.9.8", "typing-extensions<=4.16.0"
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "pyrailroad.VERSION"}

[project.optional-dependencies]
tests = ["pytest<=9.1.1", "coverage<=7.16.2"]
documentation = ["markdown-exec==1.11.0", "mkdocs==1.6.1", "mkdocs-material==9.5.42", "mkdocs-autorefs==1.4.4", "mkdocs-plugin-inline-svg==0.1.0", "mkdocstrings[python]==0.26.2", "mkdocstrings-python==1.12.2", "griffe==1.15.0"]

[project.scripts]
py-railroad = "pyrailroad.cli:cli"
